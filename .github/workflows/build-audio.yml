name: Build exam audio

on:
  push:
    branches: [main]
    paths: ['schedule.json', 'build/**', '.github/workflows/build-audio.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install gTTS
      - run: python3 build/build.py
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add audio/exam.mp3
          git diff --cached --quiet || git commit -m "Build exam audio"
          git push
